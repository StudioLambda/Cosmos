# Cache implementation configuration.
#
# Known implementations: cache/memory and cache/redis. The quickstart currently
# constructs cache/memory; changing the composition root is required to use Redis.
cache:
  memory:
    # A zero expiration means values written with a zero TTL do not expire.
    expiration: 0s
    # A zero cleanup interval delegates cleanup behavior to go-cache.
    cleanup: 0s

  redis:
    # Defaults: tcp and localhost:6379.
    network: tcp
    addr: localhost:6379
    # Load credentials from environment-specific configuration, not source control.
    username: ""
    password: ""
    # Redis logical database number.
    db: 0
