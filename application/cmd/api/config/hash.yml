# Password hashing implementation configuration.
#
# Known implementations: hash/argon2 and hash/bcrypt. The quickstart uses
# Argon2id. Change application composition to select bcrypt for legacy hashes.
hash:
  argon2:
    # Defaults are provided by the upstream Argon2 library when values are zero.
    hash_length: 32
    salt_length: 16
    time_cost: 3
    memory_cost: 65536
    parallelism: 24
    mode: 2
    version: 19

  bcrypt:
    # Default and OWASP-recommended minimum: 12.
    cost: 12
