# HTTP server and middleware configuration.
#
# These values are consumed by the quickstart HTTP composition in
# application/internal/bootstrap/http.go.
http:
  server:
    # Default: framework.DefaultServerConfig().Host.
    host: 0.0.0.0
    # Default: framework.DefaultServerConfig().Port.
    port: 8080
    # Defaults: framework.DefaultServerConfig() timeout values.
    read_header_timeout: 10s
    read_timeout: 30s
    write_timeout: 60s
    idle_timeout: 120s
    max_header_bytes: 1048576

  cors:
    # Do not use "*" with allow_credentials: true.
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, HEAD]
    allowed_headers: [Accept, Content-Type]
    exposed_headers: []
    allow_credentials: false
    # Browser preflight cache duration in seconds.
    max_age: 300

  csrf:
    # Trusted cross-origin callers for state-changing requests.
    trusted_origins: []

  secure_headers:
    content_type_options: nosniff
    frame_options: DENY
    referrer_policy: strict-origin-when-cross-origin
    xss_protection: "0"
    strict_transport_security: max-age=63072000; includeSubDomains
    # CSP and Permissions-Policy are application-specific.
    content_security_policy: ""
    permissions_policy: ""

  # Rate limiting is intentionally not enabled by the quickstart. Configure
  # middleware.RateLimitWith with an identity resolver that understands your
  # trusted reverse-proxy topology.
