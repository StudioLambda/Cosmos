# Observability configuration.
observability:
  logger:
    # The quickstart uses logger/slog. Supported formats are json, text, and
    # colored. Supported output destinations are stdout and stderr.
    level: info
    format: colored
    output: stderr

  correlation:
    # Response header used to propagate the request correlation ID.
    # Default: X-Correlation-ID.
    header: X-Correlation-ID
